# light_http_server
#
# ubuntu 24.04 PC
#
# 1. how to make
# $ make
# 2. how to run
# $ sudo ./light_http_server
#
# server.conf

# comments out lines are defaults
#

http_host=192.168.1.170
server_name=192.168.1.170
server_port=80

#
# Timeout support ---- v1.3.2
# The number of seconds before receives and sends time out.
#
#timeout=120
timeout=30

# Max Connection count
# thread start counts are maxconnect + 1
maxconnect=50

# Allow networks ip/net-mask,.....
allow_networks=192.168.1.0/255.255.255.0

#web_root=./www
web_root=/home/your-id/your-domain/www/html
# larvel
#web_root=/home/your-id/www/local-test/laravelapp/blog/public
cgi_root=/home/your-id/your-domain/www/cgi-bin
# larable index へ redirect する時指定する。
#larable_index=index.php
# laravel .env を、下記に、設定してください。
# APP_URL=http://192.168.1.170

#cgi_error_log=on
cgi_log_path=./cgi_error.log
